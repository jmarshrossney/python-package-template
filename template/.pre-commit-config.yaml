repos:

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.7
    hooks:
      # Update lockfile.
      - id: uv-lock

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.6
    hooks:
      # Run the formatter.
      - id: ruff-format
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]

  - repo: https://github.com/jmarshrossney/desphinx
    # Untagged; pinned to a commit.
    rev: 4137ea2938abee8d2ada8b3256b316242305fca3
    hooks:
      # Rewrite reST/Sphinx markup in docstrings and comments as Markdown.
      - id: desphinx
        args: [ --fix ]
