[project]

use_directory_urls = false

site_name = "python-package-template"
site_description = "A template for Python packages built with uv, just, ruff, pyright, pytest and zensical."
site_author = "Joe Marsh Rossney"
site_url = "https://jmarshrossney.github.io/python-package-template"

repo_name = "jmarshrossney/python-package-template"
repo_url = "https://github.com/jmarshrossney/python-package-template"

copyright = """
Copyright &copy; 2026 Joe Marsh Rossney
"""

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Example" = "example.md" },
  { "API Reference" = "api.md" },
]

# Math rendering with KaTeX.
#
# `pymdownx.arithmatex` with `generic = true` (see below) leaves the maths as
# inert `\(...\)` / `\[...\]` markup for a client-side renderer to pick up.
# `_static/js/katex.js` is that glue: it hooks zensical's `document$` observable
# so maths is re-rendered after each instant-navigation page swap, not just on
# the initial load. It must be listed *before* the KaTeX bundles -- the
# subscription is only registered here, and fires later, by which point
# `renderMathInElement` is defined.
#
# Delete all three blocks below (plus `arithmatex`) if the docs have no maths.
extra_javascript = [
    "_static/js/katex.js",
    "https://unpkg.com/katex@0/dist/katex.min.js",
    "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
]
extra_css = [
    "https://unpkg.com/katex@0/dist/katex.min.css",
]

[project.theme]

language = "en"

# The full set of available features is documented at
# https://zensical.org/docs/setup/ -- these are the ones we always want.
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
# Placeholder -- pick something apt from https://lucide.dev/icons/
logo = "lucide/smile"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jmarshrossney"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
# `generic = true` emits renderer-agnostic markup for KaTeX to pick up at
# runtime -- see the `extra_javascript` comment above.
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]


# Mkdocstrings
# ------------
[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
annotations_path = "brief"
docstring_style = "google"
docstring_section_style = "list"
inherited_members = true
line_length = 88
merge_init_into_class = true
separate_signature = true
show_signature = true
signature_crossrefs = true
show_signature_annotations = true
show_if_no_docstring = false
show_root_full_path = true
show_root_heading = true
show_root_members_full_path = false
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
